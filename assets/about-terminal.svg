<text x="410.0" y="24" text-anchor="middle" class="t o" style="font-size:12px">dip@lab: ~</text>
<text x="24" y="74" class="t" clip-path="url(#c0)"><tspan class="pr">dip@lab:~$ </tspan><tspan class="w">whoami</tspan></text><text x="24" y="97" class="t fd" style="animation-delay:1.52s"><tspan class="o">Dip Nalawade | cybersecurity graduate | Pune, India</tspan></text><text x="24" y="120" class="t" clip-path="url(#c2)"><tspan class="pr">dip@lab:~$ </tspan><tspan class="w">cat about.txt</tspan></text><text x="24" y="143" class="t fd" style="animation-delay:3.25s"><tspan class="o">Learns security by building labs, testing detections and documenting what breaks.</tspan></text><text x="24" y="166" class="t" clip-path="url(#c4)"><tspan class="pr">dip@lab:~$ </tspan><tspan class="w">./achievements.sh</tspan></text><text x="24" y="189" class="t fd" style="animation-delay:5.16s"><tspan class="g">[+] TryHackMe ...... Top 1% globally | 250+ rooms &amp; CTFs | SOC L1</tspan></text><text x="24" y="212" class="t fd" style="animation-delay:5.56s"><tspan class="g">[+] HA SOC lab ..... OPNsense CARP/pfsync, Wazuh, TheHive, Cortex, MISP</tspan></text><text x="24" y="235" class="t fd" style="animation-delay:5.96s"><tspan class="g">[+] Cloud honeypot . 266,000+ attacks analysed on Azure (T-Pot)</tspan></text><text x="24" y="258" class="t fd" style="animation-delay:6.36s"><tspan class="g">[+] SOAR lab ....... Splunk &gt; Tines &gt; Wazuh &gt; Jira containment flow</tspan></text><text x="24" y="281" class="t" clip-path="url(#c9)"><tspan class="pr">dip@lab:~$ </tspan><tspan class="w">./status.sh</tspan></text><text x="24" y="304" class="t fd" style="animation-delay:8.00s"><tspan class="y">[~] Open to entry-level cybersecurity roles</tspan></text><text x="24" y="327" class="t pr cur" style="animation-delay:8.40s">dip@lab:~$ <tspan class="blk">█</tspan></text>
